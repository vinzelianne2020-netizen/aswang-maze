<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aswang Maze</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/site.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
  <main class="container d-flex min-vh-100 align-items-center justify-content-center py-5">
    <section class="main-menu text-center">
      <p class="eyebrow mb-2">Barangay Eskinita</p>
      <h1 class="display-3 fw-bold mb-3">ASWANG MAZE</h1>
      <p class="lead text-secondary mb-5">Find the keys. Unlock the exit. Do not let it hear you.</p>
      <div class="d-grid gap-3 mx-auto menu-actions">
        <button id="play-button" class="btn btn-danger btn-lg" type="button">Play</button>
        <button id="levels-button" class="btn btn-outline-light" type="button">Levels</button>
        <button id="leaderboard-button" class="btn btn-outline-light" type="button">Leaderboard</button>
        <button id="settings-button" class="btn btn-outline-light" type="button">Settings</button>
      </div>
    </section>
  </main>

  <div class="modal fade" id="username-modal" tabindex="-1" aria-labelledby="username-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-light border-danger">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="username-title">Enter the maze</h2>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="username-form">
          <div class="modal-body">
            <label for="username" class="form-label">Username</label>
            <input id="username" class="form-control bg-black text-light border-secondary" autocomplete="username" maxlength="16">
            <div id="username-error" class="text-danger small mt-2 d-none" role="alert"></div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-danger">Enter</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="levels-modal" tabindex="-1" aria-labelledby="levels-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header"><h2 class="modal-title fs-5" id="levels-title">Choose a level</h2><button class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div id="levels-list" class="modal-body level-list" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="leaderboard-modal" tabindex="-1" aria-labelledby="leaderboard-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header"><h2 class="modal-title fs-5" id="leaderboard-title">Leaderboard</h2><button class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body">
          <label for="leaderboard-level" class="form-label">Level</label>
          <select id="leaderboard-level" class="form-select bg-black text-light border-secondary"></select>
          <ol id="leaderboard-list" class="leaderboard-list mt-3" aria-live="polite"></ol>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="menu-settings-modal" tabindex="-1" aria-labelledby="menu-settings-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header"><h2 class="modal-title fs-5" id="menu-settings-title">Settings</h2><button class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body settings-dialog">
          <label>Mouse sensitivity <input id="menu-sensitivity" type="range" min="0.2" max="3" step="0.1"></label>
          <label>Brightness <input id="menu-brightness" type="range" min="0.5" max="1.8" step="0.05"></label>
          <label>Graphics quality <select id="menu-quality"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></label>
          <label>Master volume <input id="menu-master-volume" type="range" min="0" max="1" step="0.05"></label>
          <label>Effects volume <input id="menu-effects-volume" type="range" min="0" max="1" step="0.05"></label>
          <label>Ambience volume <input id="menu-ambience-volume" type="range" min="0" max="1" step="0.05"></label>
          <label class="setting-check"><input id="menu-subtitles" type="checkbox"> Show sound subtitles</label>
          <label class="setting-check"><input id="menu-reduced-flashing" type="checkbox"> Reduce flashing lights</label>
          <div class="keybind-list" aria-label="Control bindings">
            <button type="button" data-menu-bind="forward">Move forward: W</button>
            <button type="button" data-menu-bind="back">Move backward: S</button>
            <button type="button" data-menu-bind="left">Move left: A</button>
            <button type="button" data-menu-bind="right">Move right: D</button>
            <button type="button" data-menu-bind="sprint">Sprint: Shift</button>
            <button type="button" data-menu-bind="interact">Interact: E</button>
            <button type="button" data-menu-bind="flashlight">Flashlight: F</button>
            <button type="button" data-menu-bind="map">Map: M</button>
            <button type="button" data-menu-bind="pause">Pause: Escape</button>
          </div>
        </div>
        <div class="modal-footer"><button id="menu-settings-reset" class="btn btn-outline-light" type="button">Reset defaults</button><button class="btn btn-danger" data-bs-dismiss="modal" type="button">Done</button></div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="app-toast" class="toast text-bg-dark border-secondary" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header text-bg-dark border-secondary">
        <strong id="toast-title" class="me-auto"></strong>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div id="toast-message" class="toast-body"></div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/ui.js?v=threejs-route-2"></script>
</body>
</html>
