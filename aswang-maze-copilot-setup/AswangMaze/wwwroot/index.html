<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aswang Maze</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/site.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
  <main class="container d-flex min-vh-100 align-items-center justify-content-center py-5">
    <section class="main-menu text-center">
      <p class="eyebrow mb-2">Barangay Eskinita</p>
      <h1 class="display-3 fw-bold mb-3">ASWANG MAZE</h1>
      <p class="lead text-secondary mb-5">Find the keys. Unlock the exit. Do not let it hear you.</p>
      <div class="d-grid gap-3 mx-auto menu-actions">
        <button id="play-button" class="btn btn-danger btn-lg" type="button">Play</button>
        <button id="levels-button" class="btn btn-outline-light" type="button">Levels</button>
        <button id="leaderboard-button" class="btn btn-outline-light" type="button">Leaderboard</button>
        <button id="settings-button" class="btn btn-outline-light" type="button">Settings</button>
      </div>
    </section>
  </main>

  <div class="modal fade" id="username-modal" tabindex="-1" aria-labelledby="username-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-light border-danger">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="username-title">Enter the maze</h2>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="username-form">
          <div class="modal-body">
            <label for="username" class="form-label">Username</label>
            <input id="username" class="form-control bg-black text-light border-secondary" autocomplete="username" maxlength="16">
            <div id="username-error" class="text-danger small mt-2 d-none" role="alert"></div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-danger">Enter</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="app-toast" class="toast text-bg-dark border-secondary" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header text-bg-dark border-secondary">
        <strong id="toast-title" class="me-auto"></strong>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div id="toast-message" class="toast-body"></div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/ui.js?v=threejs-route-2"></script>
</body>
</html>
